openapi: 3.1.0
info:
  title: Tiendas-Track API
  version: "2.0.0"
  description: |
    API del monolito modular Tiendas-Track (F2: autenticación, RBAC y órdenes).

    **Contrato canónico (ADR-10):** este archivo es la fuente de verdad de los
    contratos HTTP. Se sirve embebido en el binario en:

    - `GET /api/v1/openapi.yaml` — especificación original.
    - `GET /api/v1/openapi.json` — especificación en JSON.
    - `GET /swagger/index.html` — UI de Swagger.

    **Autenticación:**
    - `POST /api/v1/auth/login` devuelve un *access token* (JWT, 15 min) y un
      *refresh token* rotativo (30 días, guardado solo como hash SHA-256).
    - El access token se envía en `Authorization: Bearer <token>`.
    - Un token de invitado (scope `order:<id>`) solo permite
      `GET /api/v1/orders/{id}` sobre su orden.

    **RBAC a nivel de datos (RF-02):** el servidor limita cada consulta al
    ámbito del rol autenticado; el cliente nunca puede solicitar otra tienda,
    flota u orden sin recibir `403 FORBIDDEN_SCOPE` (o `404` si conviene no
    revelar existencia).

    **Errores:** todos los errores usan el sobre
    `{ "error": { "code": "CODE", "message": "..." } }`.
  license:
    name: Propietario
servers:
  - url: http://localhost:8080
    description: Desarrollo local (Docker Compose)
tags:
  - name: Auth
    description: Registro, login, rotación de refresh tokens y tokens de invitado.
  - name: Orders
    description: Ciclo de vida de órdenes de logística (RF-05) y asignación de flota (RF-06).
  - name: Stores
    description: Alta y consulta de la tienda del tendero (RF-02), como paso propio del registro.
  - name: Telemetry
    description: Ingesta GPS (RF-03), Bulk Sync idempotente (RF-09) y consultas de traza con RBAC.
  - name: Vehicles
    description: Flota visible para el rol autenticado, con la última posición conocida (RF-02).
  - name: Realtime
    description: Canal WebSocket `/ws` para posición en tiempo real filtrada por rol (RF-04, ADR-03).
  - name: Ops
    description: Operabilidad del servicio (F1).

paths:
  /healthz:
    get:
      tags: [Ops]
      operationId: healthz
      summary: Liveness del proceso
      description: No toca la base de datos. Se usa como healthcheck del contenedor.
      responses:
        "200":
          description: Proceso vivo.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    examples: ["ok"]

  /readyz:
    get:
      tags: [Ops]
      operationId: readyz
      summary: Readiness con ping a PostgreSQL
      responses:
        "200":
          description: Base de datos accesible.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    examples: ["ready"]
        "503":
          description: Sin base de datos disponible.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    examples: ["database unavailable"]

  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Auto-registro de tienda o conductor
      description: |
        Solo admite `role` igual a `STORE` o `DRIVER`. La cuenta de proveedor
        (`PROVIDER`) se crea por seed/administración (RF-01).

        El objeto `store` es **opcional**: si se incluye, la tienda nace junto
        a su dueño en la misma transacción; si se omite, el alta se hace luego
        con `POST /api/v1/stores` (un paso propio del registro). Si `store`
        viene, solo se admite con `role=STORE` y exige coordenadas (PostGIS,
        ADR-09).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, role]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  minLength: 8
                full_name:
                  type: string
                role:
                  type: string
                  enum: [STORE, DRIVER]
                store:
                  type: object
                  description: |
                    Opcional. Solo con `role=STORE`; si se omite, la tienda se
                    da de alta con `POST /api/v1/stores`.
                  required: [name, location]
                  properties:
                    name:
                      type: string
                    address:
                      type: string
                    location:
                      $ref: "#/components/schemas/Point"
            examples:
              tienda:
                summary: Registro de tienda con georreferenciación
                value:
                  email: tienda@example.com
                  password: secreto123
                  full_name: Tienda Central
                  role: STORE
                  store:
                    name: Tienda La Esquina
                    address: Cra 7 # 72-40, Bogotá
                    location: { lat: 4.6550, lon: -74.0632 }
              conductor:
                summary: Registro de conductor
                value:
                  email: conductor@example.com
                  password: secreto123
                  full_name: Carlos Ramírez
                  role: DRIVER
      responses:
        "201":
          description: Usuario creado (y su tienda, si el payload incluye `store`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Email ya registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Autenticación y emisión del par de tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Par de tokens emitido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Usuario suspendido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Rotación del refresh token
      description: |
        El refresh token presentado se **revoca** y se emite uno nuevo
        (rotación, ADR-04). Reutilizar un token ya rotado devuelve `401`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: Nuevo par de tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoca el refresh token presentado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "204":
          description: Token revocado (idempotente).
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: currentUser
      summary: Usuario autenticado
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Perfil del usuario (sin hash de contraseña).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/auth/guest-token:
    post:
      tags: [Auth]
      operationId: issueGuestToken
      summary: Emite un token de invitado con scope sobre una orden
      description: |
        Solo `STORE` (sobre su propia tienda) y `PROVIDER` (sobre su flota)
        pueden emitirlo. El token resultante solo autoriza
        `GET /api/v1/orders/{id}` de la orden indicada y expira en
        `GUEST_TOKEN_TTL` (48 h por defecto).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id]
              properties:
                order_id:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Token de invitado emitido.
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_at, order_id]
                properties:
                  token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                  order_id:
                    type: string
                    format: uuid
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/stores:
    post:
      tags: [Stores]
      operationId: createStore
      summary: Da de alta la tienda del tendero (rol STORE, paso propio del registro)
      description: |
        El alta de tienda es un paso separado de `POST /api/v1/auth/register`:
        el usuario `STORE` puede registrarse primero y crear su tienda después
        (o hacerlo en el mismo registro incluyendo `store`). Solo existe una
        tienda por dueño: repetir el alta devuelve `409`. El punto se persiste
        como `geometry(Point,4326)` con PostGIS (ADR-09).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStoreRequest"
            examples:
              bogota:
                summary: Tienda en Bogotá
                value:
                  name: Tienda La Esquina
                  address: Cra 7 # 72-40, Bogotá
                  location: { lat: 4.6550, lon: -74.0632 }
      responses:
        "201":
          description: Tienda creada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: El usuario ya tiene una tienda registrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/stores/me:
    get:
      tags: [Stores]
      operationId: getMyStore
      summary: Devuelve la tienda del usuario autenticado (rol STORE)
      description: |
        Útil para saber si el alta sigue pendiente: si el usuario aún no tiene
        tienda responde `404`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Tienda del usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/orders:
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Crea una orden (rol STORE)
      description: |
        La orden queda siempre vinculada a la tienda del token autenticado:
        enviar otro `store_id` devuelve `403`. `origin` y `destination` se
        persisten como `geometry(Point,4326)` con PostGIS (ADR-09) y
        `distance_meters` se calcula con `ST_DistanceSphere`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
            examples:
              estandar:
                summary: Orden urbana
                value:
                  external_ref: "PED-1001"
                  origin: { lat: 4.7108, lon: -74.0721 }
                  destination: { lat: 4.6578, lon: -74.0561 }
                  destination_address: "Cra 7 # 72-40, Bogotá"
      responses:
        "201":
          description: Orden creada (`Location` con la URL del recurso).
          headers:
            Location:
              schema:
                type: string
              description: "`/api/v1/orders/{id}`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`external_ref` duplicado (idempotencia)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"

    get:
      tags: [Orders]
      operationId: listOrders
      summary: Lista las órdenes visibles para el rol autenticado
      description: |
        El alcance se aplica en el servidor (RF-02):

        - `STORE`: solo órdenes de su tienda.
        - `DRIVER`: solo órdenes asignadas a él.
        - `PROVIDER`: solo órdenes de vehículos de su flota.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Página de órdenes.
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
                  total:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/orders/{id}:
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Detalle de una orden
      description: |
        Acepta también tokens de invitado con `scope: order:<id>`; fuera de su
        orden devuelven `403`.
      parameters:
        - $ref: "#/components/parameters/OrderID"
      responses:
        "200":
          description: Orden.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orders/{id}/status:
    patch:
      tags: [Orders]
      operationId: changeOrderStatus
      summary: Transición de estado del ciclo de vida (RF-05)
      description: |
        Máquina de estados:

        - `CREATED → IN_TRANSIT | CANCELLED`
        - `IN_TRANSIT → DELIVERED | CANCELLED`
        - `DELIVERED` y `CANCELLED` son estados finales.

        Quien puede transicionar: la tienda dueña o el conductor asignado.
        Cada cambio inserta un registro en `order_events` (append-only) en la
        misma transacción. Una transición ilegal devuelve `409`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: "#/components/schemas/OrderStatus"
      responses:
        "200":
          description: Orden actualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Transición no permitida por la máquina de estados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/orders/{id}/assignment:
    post:
      tags: [Orders]
      operationId: assignOrder
      summary: Asigna vehículo y conductor a la orden (RF-06)
      description: |
        Rol `PROVIDER` únicamente. El vehículo debe pertenecer a su flota y el
        conductor debe estar asignado a ese vehículo; si el vehículo es de otro
        proveedor la respuesta es `403` (no se revela su existencia).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicle_id, driver_id]
              properties:
                vehicle_id:
                  type: string
                  format: uuid
                driver_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Orden asignada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/telemetry/points:
    post:
      tags: [Telemetry]
      operationId: ingestPoint
      summary: Ingesta de una muestra GPS (RF-03)
      description: |
        Roles `DRIVER` y `PROVIDER`.

        - `DRIVER`: solo puede reportar su vehículo asignado; si omite
          `vehicle_id` el servidor lo deriva de su perfil.
        - `PROVIDER`: solo vehículos de su flota.
        - Si se envía `order_id`, la orden debe existir y estar asignada a ese
          vehículo (`422` en caso contrario).

        La clave primaria `(time, vehicle_id, device_seq)` hace la operación
        idempotente: un reintento del dispositivo responde `201` con
        `duplicate: true` y **no** reemite el evento de tiempo real.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelemetryPointInput"
      responses:
        "201":
          description: Muestra aceptada (nueva o duplicada).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/telemetry/bulk:
    post:
      tags: [Telemetry]
      operationId: ingestTelemetryBulk
      summary: Sincronización masiva offline-first (RF-09)
      description: |
        Roles `DRIVER` y `PROVIDER`. Hasta **1000 puntos** por lote.

        El header `Idempotency-Key` es obligatorio (8–128 caracteres). El
        recibo se guarda en `app.sync_receipts` en la **misma transacción** que
        las muestras: repetir la clave devuelve `already_processed: true` sin
        insertar ni republicar nada. Los puntos repetidos dentro de un lote
        nuevo se descartan y se informan en `duplicates`.

        Los eventos de tiempo real solo se publican para las muestras que la
        base de datos confirmó como nuevas.
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Clave idempotente del lote (generada por el dispositivo).
          schema:
            type: string
            minLength: 8
            maxLength: 128
          examples: ["device-8f3a-batch-0001"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkSyncRequest"
      responses:
        "200":
          description: Lote procesado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkSyncResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/vehicles:
    get:
      tags: [Vehicles]
      operationId: listVehicles
      summary: Vehículos visibles para el rol autenticado
      description: |
        El alcance se aplica en el servidor (RF-02):

        - `PROVIDER`: toda su flota.
        - `STORE`: vehículos con al menos una orden de su tienda (vista dual).
        - `DRIVER`: su vehículo asignado.
        - Invitado (`scope: order:<id>`): `403`.

        Cada vehículo incluye `last_position` con la última muestra GPS
        conocida (`null` si aún no reporta). Orden estable por placa.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            minimum: 0
            maximum: 200
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: Página de vehículos del alcance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleListResponse"
              example:
                items:
                  - id: "e1cf4001-75f0-45fa-94e4-484b2335213f"
                    plate: "ABC123"
                    status: "ACTIVE"
                    last_position:
                      vehicle_id: "e1cf4001-75f0-45fa-94e4-484b2335213f"
                      device_seq: 100
                      lat: 4.6483
                      lon: -74.072
                      speed_kph: 18
                      accuracy_m: 5.5
                      heading: 45
                      source: "DEVICE"
                      time: "2026-10-28T19:15:00Z"
                      received_at: "2026-10-28T19:15:13.742092Z"
                total: 1
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/vehicles/{id}/latest:
    get:
      tags: [Telemetry]
      operationId: getLatestPosition
      summary: Última posición conocida del vehículo
      description: |
        RBAC: `PROVIDER` su flota, `DRIVER` su vehículo, `STORE` los vehículos
        de sus órdenes (vista dual entrada/salida). El token de invitado **no**
        tiene acceso REST a telemetría.

        Un vehículo inexistente o ajeno responde `403` (anti-enumeración).
        La lectura pasa por un circuit breaker: si la base de datos está
        degradada responde `503 CIRCUIT_OPEN` con `Retry-After`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VehicleID"
      responses:
        "200":
          description: Última muestra registrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LatestPositionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/vehicles/{id}/track:
    get:
      tags: [Telemetry]
      operationId: getVehicleTrack
      summary: Traza histórica del vehículo
      description: |
        Mismo RBAC que `/latest`. `from` y `to` son obligatorios (RFC3339) y el
        rango máximo es de 7 días. `limit` por defecto 1000, máximo 5000.
        Resultados ordenados del más reciente al más antiguo.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VehicleID"
        - name: from
          in: query
          description: |
            Inicio del rango en formato RFC3339 (UTC).
            Escríbelo así: `AAAA-MM-DDTHH:mm:ssZ`.
            Ejemplo: `2026-10-28T12:00:00Z`.
          required: true
          example: "2026-10-28T12:00:00Z"
          schema:
            type: string
            format: date-time
            pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(Z|[+-][0-9]{2}:[0-9]{2})$'
            example: "2026-10-28T12:00:00Z"
        - name: to
          in: query
          description: |
            Fin del rango en formato RFC3339 (UTC).
            Escríbelo así: `AAAA-MM-DDTHH:mm:ssZ`.
            Ejemplo: `2026-10-28T13:00:00Z`.
          required: true
          example: "2026-10-28T13:00:00Z"
          schema:
            type: string
            format: date-time
            pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(Z|[+-][0-9]{2}:[0-9]{2})$'
            example: "2026-10-28T13:00:00Z"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 1000
            minimum: 0
            maximum: 5000
      responses:
        "200":
          description: Traza en el rango solicitado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackResponse"
              example:
                vehicle_id: "e1cf4001-75f0-45fa-94e4-484b2335213f"
                from: "2026-10-28T17:00:00Z"
                to: "2026-10-28T19:20:00Z"
                count: 3
                points:
                  - vehicle_id: "e1cf4001-75f0-45fa-94e4-484b2335213f"
                    order_id: "64be6c96-a444-43c3-ae1e-60e3f2a05bf9"
                    device_seq: 100
                    lat: 4.6483
                    lon: -74.072
                    speed_kph: 18
                    accuracy_m: 5.5
                    heading: 45
                    source: "DEVICE"
                    time: "2026-10-28T19:15:00Z"
                    received_at: "2026-10-28T19:15:13.742092Z"
                  - vehicle_id: "e1cf4001-75f0-45fa-94e4-484b2335213f"
                    order_id: "64be6c96-a444-43c3-ae1e-60e3f2a05bf9"
                    device_seq: 101
                    lat: 4.648583
                    lon: -74.071419
                    speed_kph: 21.5
                    accuracy_m: 5.5
                    heading: 48
                    source: "DEVICE"
                    time: "2026-10-28T19:14:00Z"
                    received_at: "2026-10-28T19:15:13.742092Z"
                  - vehicle_id: "e1cf4001-75f0-45fa-94e4-484b2335213f"
                    order_id: "64be6c96-a444-43c3-ae1e-60e3f2a05bf9"
                    device_seq: 102
                    lat: 4.648836
                    lon: -74.070853
                    speed_kph: 25
                    accuracy_m: 5.5
                    heading: 51
                    source: "DEVICE"
                    time: "2026-10-28T19:13:00Z"
                    received_at: "2026-10-28T19:15:13.742092Z"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /ws:
    get:
      tags: [Realtime]
      operationId: connectWebSocket
      summary: Canal WebSocket de telemetría en tiempo real (RF-04)
      description: |
        Handshake autenticado y suscripción autorizada contra el scope del
        token. El token se envía en `Authorization: Bearer <token>` (clientes
        nativos) o en `?access_token=<token>` (navegadores). Sin token válido
        el handshake responde `401` y no hay upgrade.

        La sesión se cierra con código `4401` cuando expira el token que la
        autenticó (el cliente debe reconectar con uno nuevo). Un cliente que no
        consume su cola de salida se cierra con `1008`.

        **Canales disponibles** (`<tipo>:<uuid>`):

        | Canal | Quién puede suscribirse |
        |---|---|
        | `fleet:provider:{provider_id}` | `PROVIDER` dueño de esa flota |
        | `fleet:store:{store_id}` | `STORE` dueño de esa tienda (vista dual) |
        | `order:{order_id}` | `STORE` dueño, `DRIVER` asignado, `PROVIDER` de la flota y el invitado con `scope: order:<id>` |
        | `vehicle:{vehicle_id}` | `PROVIDER` de la flota, `DRIVER` asignado, `STORE` con una orden de ese vehículo |

        Suscribirse a un canal ajeno responde
        `{"type":"error","code":"FORBIDDEN_SCOPE",...}` sin cerrar la conexión.

        **Protocolo** (JSON, mensajes de cliente ≤ 4 KiB):

        Cliente → servidor: `{"action":"subscribe","channel":"..."}`,
        `{"action":"unsubscribe","channel":"..."}`, `{"action":"ping"}`.

        Servidor → cliente: `{"type":"subscribed","channel":"..."}`,
        `{"type":"unsubscribed","channel":"..."}`,
        `{"type":"pong"}`, `{"type":"error","code":"...","message":"..."}` y
        `{"type":"event","channel":"...","at":"...","data":{...}}` donde `data`
        es un `TelemetryPoint`.

        Las concesiones se revalidan cada `WS_GRANT_TTL` (60 s por defecto):
        si el scope cambió, la suscripción se revoca.
      security:
        - bearerAuth: []
      parameters:
        - name: access_token
          in: query
          required: false
          description: Alternativa al header `Authorization` para navegadores.
          schema:
            type: string
      responses:
        "101":
          description: Upgrade a WebSocket aceptado.
        "401":
          $ref: "#/components/responses/Unauthenticated"
      x-websocket:
        path: /ws
        protocol: JSON
        channels:
          - fleet:provider:{provider_id}
          - fleet:store:{store_id}
          - order:{order_id}
          - vehicle:{vehicle_id}
        closeCodes:
          "1008": Consumidor lento o límite de canales superado.
          "4401": Token expirado; reconectar con un token nuevo.
        limits:
          maxMessageBytes: 4096
          maxSubscriptions: 32
          sendBuffer: 256
        latencyBudgetMs: 500

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token JWT (HS256) de `POST /api/v1/auth/login`, o token de
        invitado con scope `order:<id>` cuando el endpoint lo permite.

  parameters:
    OrderID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    VehicleID:
      name: id
      in: path
      required: true
      description: Identificador del vehículo.
      schema:
        type: string
        format: uuid

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              examples: [UNAUTHENTICATED, FORBIDDEN_SCOPE, NOT_FOUND,
                         ORDER_INVALID_TRANSITION, VALIDATION_ERROR]
            message:
              type: string

    User:
      type: object
      required: [id, email, full_name, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        role:
          $ref: "#/components/schemas/Role"

    Role:
      type: string
      enum: [PROVIDER, STORE, DRIVER]

    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in, token_type]
      properties:
        access_token:
          type: string
          description: JWT de acceso (15 min por defecto).
        refresh_token:
          type: string
          description: Refresh token rotativo (30 días, hash SHA-256 en BD).
        expires_in:
          type: integer
          description: Segundos hasta la expiración del access token.
        token_type:
          type: string
          examples: ["Bearer"]
        user:
          $ref: "#/components/schemas/User"

    Point:
      type: object
      required: [lat, lon]
      properties:
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
        lon:
          type: number
          format: double
          minimum: -180
          maximum: 180

    CreateStoreRequest:
      type: object
      required: [name, location]
      description: Alta de tienda como paso propio del registro (RF-02).
      properties:
        name:
          type: string
          maxLength: 120
        address:
          type: string
          description: Opcional (puede quedar vacío).
        location:
          $ref: "#/components/schemas/Point"

    Store:
      type: object
      required: [id, name, owner_user_id, lat, lon, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        owner_user_id:
          type: string
          format: uuid
          description: Usuario con rol STORE dueño de la tienda (una por dueño).
        address:
          type: string
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        created_at:
          type: string
          format: date-time

    OrderStatus:
      type: string
      enum: [CREATED, IN_TRANSIT, DELIVERED, CANCELLED]

    CreateOrderRequest:
      type: object
      required: [external_ref, origin, destination]
      properties:
        external_ref:
          type: string
          description: Referencia externa única (clave de idempotencia).
        store_id:
          type: string
          format: uuid
          description: Opcional; debe coincidir con la tienda del token.
        customer_id:
          type: string
          format: uuid
          nullable: true
        origin:
          $ref: "#/components/schemas/Point"
        destination:
          $ref: "#/components/schemas/Point"
        destination_address:
          type: string

    Order:
      type: object
      required: [id, external_ref, store_id, status, origin, destination, placed_at]
      properties:
        id:
          type: string
          format: uuid
        external_ref:
          type: string
        store_id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/OrderStatus"
        assigned_vehicle_id:
          type: string
          format: uuid
        assigned_driver_id:
          type: string
          format: uuid
        origin:
          $ref: "#/components/schemas/Point"
        destination:
          $ref: "#/components/schemas/Point"
        destination_address:
          type: string
        distance_meters:
          type: number
          description: Distancia esférica calculada al crear (ST_DistanceSphere).
        placed_at:
          type: string
          format: date-time
        picked_up_at:
          type: string
          format: date-time
        delivered_at:
          type: string
          format: date-time

    TelemetrySource:
      type: string
      enum: [DEVICE, BULK_SYNC]
      description: Origen de la muestra (ingesta individual o sincronización en bloque).
    TelemetryPointInput:
      type: object
      required: [time, lat, lon]
      description: Muestra GPS enviada por el vehículo o la app del conductor.
      properties:
        vehicle_id:
          type: string
          format: uuid
          description: Opcional para `DRIVER` (se deriva de su vehículo asignado).
        order_id:
          type: string
          format: uuid
          description: Debe estar asignada al vehículo que reporta.
        time:
          type: string
          format: date-time
          description: Timestamp del dispositivo (máximo 5 min en el futuro).
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
        lon:
          type: number
          format: double
          minimum: -180
          maximum: 180
        speed_kph:
          type: number
          format: double
          minimum: 0
        accuracy_m:
          type: number
          format: double
          minimum: 0
        heading:
          type: number
          format: double
          minimum: 0
          maximum: 360
        device_seq:
          type: integer
          format: int64
          minimum: 0
          description: Secuencia local del dispositivo; parte de la clave de deduplicación.

    TelemetryPoint:
      type: object
      required: [vehicle_id, lat, lon, device_seq, source, time, received_at]
      properties:
        vehicle_id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        device_seq:
          type: integer
          format: int64
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        speed_kph:
          type: number
          format: double
        accuracy_m:
          type: number
          format: double
        heading:
          type: number
          format: double
        source:
          $ref: "#/components/schemas/TelemetrySource"
        time:
          type: string
          format: date-time
        received_at:
          type: string
          format: date-time
          description: Momento en que el servidor recibió la muestra.

    Vehicle:
      type: object
      required: [id, plate, status]
      properties:
        id:
          type: string
          format: uuid
        plate:
          type: string
          maxLength: 10
        status:
          $ref: "#/components/schemas/VehicleStatus"
        last_position:
          description: Última muestra GPS conocida (`null` si aún no reporta).
          oneOf:
            - $ref: "#/components/schemas/TelemetryPoint"
            - type: "null"

    VehicleStatus:
      type: string
      enum: [ACTIVE, INACTIVE]

    VehicleListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Vehicle"
        total:
          type: integer
          description: Total de vehículos del alcance antes de paginar.

    IngestResponse:
      type: object
      required: [point, duplicate]
      properties:
        point:
          $ref: "#/components/schemas/TelemetryPoint"
        duplicate:
          type: boolean
          description: '`true` si la PK ya existía (reintento del dispositivo).'

    BulkSyncRequest:
      type: object
      required: [points]
      properties:
        device_id:
          type: string
          maxLength: 64
        points:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: "#/components/schemas/TelemetryPointInput"

    BulkSyncResponse:
      type: object
      required: [accepted, duplicates, already_processed, processed_at]
      properties:
        accepted:
          type: integer
          description: Muestras realmente insertadas y publicadas.
        duplicates:
          type: integer
          description: Muestras descartadas por la clave primaria o por lote ya procesado.
        already_processed:
          type: boolean
          description: La `Idempotency-Key` ya se había procesado (no se reinsertó nada).
        processed_at:
          type: string
          format: date-time

    LatestPositionResponse:
      type: object
      required: [vehicle_id, point]
      properties:
        vehicle_id:
          type: string
          format: uuid
        point:
          $ref: "#/components/schemas/TelemetryPoint"

    TrackResponse:
      type: object
      required: [vehicle_id, from, to, count, points]
      properties:
        vehicle_id:
          type: string
          format: uuid
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        count:
          type: integer
        points:
          type: array
          items:
            $ref: "#/components/schemas/TelemetryPoint"

  responses:
    BadRequest:
      description: Cuerpo JSON malformado o entrada no legible.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: Sin token, token inválido o expirado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Autenticado pero fuera de su rol o ámbito de datos.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Recurso inexistente.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Reglas de negocio o validación de entrada incumplidas.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Error inesperado del servidor.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: |
        Dependencia degradada. En telemetría indica circuit breaker abierto
        (`503 CIRCUIT_OPEN`); incluye `Retry-After`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
