# Tiendas-Track — entorno local de desarrollo (F1 del plan de desarrollo).
# Uso: cp .env.example .env && make dev
# NO es una plataforma de producción: solo desarrollo y validación local.
name: tiendas-track

services:
  db:
    # Imagen HA incluye TimescaleDB + PostGIS (ADR-02, ADR-09).
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tiendas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tiendas_dev}
      POSTGRES_DB: ${POSTGRES_DB:-tiendas}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-tiendas} -d $${POSTGRES_DB:-tiendas}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-tiendas}:${POSTGRES_PASSWORD:-tiendas_dev}@db:5432/${POSTGRES_DB:-tiendas}?sslmode=disable
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-30s}
      MIGRATE_ON_STARTUP: ${MIGRATE_ON_STARTUP:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      # F2: autenticación (RF-01). En producción el secreto llega por
      # orquestador/secretos, NUNCA por este archivo.
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-720h}
      GUEST_TOKEN_TTL: ${GUEST_TOKEN_TTL:-48h}
      BCRYPT_COST: ${BCRYPT_COST:-10}
      # F3: tiempo real y resiliencia (RF-04, RNF-05).
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
      WS_GRANT_TTL: ${WS_GRANT_TTL:-60s}
      CB_FAILURE_THRESHOLD: ${CB_FAILURE_THRESHOLD:-5}
      CB_TIMEOUT: ${CB_TIMEOUT:-10s}
      # F5: agente IA (RF-10, RNF-05). Sin AI_API_KEY responde 503 controlado.
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_TIMEOUT: ${AI_TIMEOUT:-20s}
      AI_MAX_STEPS: ${AI_MAX_STEPS:-4}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped

  # Datos de demostración (F2): `make seed`. Idempotente.
  seed:
    build: ./backend
    profiles: ["seed"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tiendas}:${POSTGRES_PASSWORD:-tiendas_dev}@db:5432/${POSTGRES_DB:-tiendas}?sslmode=disable
      LOG_FORMAT: ${LOG_FORMAT:-json}
      JWT_SECRET: ${JWT_SECRET:-}
    command: ["/usr/local/bin/seed"]
    restart: "no"

  web:
    # Portal Next.js multi-rol (F4). El navegador habla con el BFF same-origin
    # /api/backend/* y con el WebSocket público del backend.
    build:
      context: ./web
      args:
        # Se incrusta en el bundle: debe ser una URL alcanzable por el navegador.
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080/ws}
    depends_on:
      - backend
    environment:
      # Red interna de Compose: el servidor de Next llama a Go por aquí.
      BACKEND_URL: http://backend:8080
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  db-data:
